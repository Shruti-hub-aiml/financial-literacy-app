
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Literacy App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f7f2;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    header {
      background: #16784a;
      color: white;
      padding: 22px;
      border-radius: 16px;
    }
    .card {
      background: white;
      padding: 18px;
      margin: 16px 0;
      border-radius: 14px;
      box-shadow: 0 2px 8px #0001;
    }
    button {
      background: #16784a;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>Money Smart</h1>
    <p>Learn. Save. Stay Safe.</p>
    <p>Financial Literacy for Rural Families</p>
  </header>

  <div class="card">
    <h2>🏦 Banking Basics</h2>
    <p>Learn about bank accounts, ATM cards and UPI.</p>
    <button onclick="alert('A bank account helps you keep your money safe.')">
      Learn More
    </button>
  </div>

  <div class="card">
    <h2>💰 Savings</h2>
    <p>Learn how to save money for future needs.</p>
    <button onclick="alert('Save a little regularly and plan your expenses.')">
      Learn More
    </button>
  </div>

  <div class="card">
    <h2>🛡️ Fraud Awareness</h2>
    <p>Learn how to identify online payment scams.</p>
    <button onclick="alert('Never share your OTP, PIN or bank password.')">
      Learn More
    </button>
  </div>

  <p>Language: English | ಕನ್ನಡ | हिंदी</p>
</body>
</html>
